# One server with automatic HTTPS. Copy .env.example to .env, fill it in, then: docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - untangle-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes:
      - caddy-data:/data
volumes:
  untangle-data:
  caddy-data:

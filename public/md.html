<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown · Untangle</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/site.css">
<style>
/* Markdown viewer (local mode): the document, with each ```mermaid block shown as a live Untangle diagram. */
.md-wrap{max-width:900px;margin:0 auto 60px}
.md-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.md-head .path{font-family:var(--mono);font-size:13px;color:var(--muted);word-break:break-all;margin:4px 0 0}
.md-doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px clamp(16px,4vw,44px);line-height:1.65;overflow-wrap:anywhere}
.md-doc>:first-child{margin-top:0}
.md-doc h1,.md-doc h2,.md-doc h3,.md-doc h4{font-family:var(--display);line-height:1.2;margin:1.6em 0 .5em}
.md-doc h1{font-size:30px}.md-doc h2{font-size:23px;padding-bottom:6px;border-bottom:1px solid var(--line)}.md-doc h3{font-size:18px}
.md-doc a{color:var(--accent)}
.md-doc img{max-width:100%;height:auto}
.md-doc pre{background:var(--code);border-radius:8px;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.5}
.md-doc pre code{background:none;padding:0}
.md-doc blockquote{margin:1em 0;padding:2px 16px;border-left:3px solid var(--line);color:var(--muted)}
.md-doc table{border-collapse:collapse;display:block;overflow:auto;margin:1em 0}
.md-doc th,.md-doc td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md-doc th{background:var(--head)}
.md-doc hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md-doc li+li{margin-top:.25em}
.md-diagram{margin:1.2em 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--canvas)}
.md-dbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13px}
.md-dbar b{font-weight:600}.md-dbar span{color:var(--muted)}
.md-frame{height:480px;min-height:260px;resize:vertical;overflow:hidden}
.md-frame iframe{display:block;width:100%;height:100%;border:0}
@media (max-width:600px){.md-doc{padding:20px 16px}.md-frame{height:400px}}
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a class="logo" href="/"><span class="logo-mark" aria-hidden="true"></span>Untangle</a>
    <div class="nav-links"><a href="/">All files</a><span class="badge">Local files</span></div>
  </nav>
  <div class="md-wrap">
    <div class="md-head">
      <div><p class="eyebrow" id="count">Markdown</p><h1 id="name">Document</h1><p class="path" id="path"></p></div>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <article class="md-doc" id="doc" aria-live="polite"></article>
  </div>
</div>
<script type="module" src="/js/md.js"></script>
</body>
</html>
